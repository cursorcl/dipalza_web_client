<section class="main-content">
    <ul class="breadcrumb breadcrumb-style">
        <li class="breadcrumb-item">
            <h5 class="page-title m-b-0">Detalle Numerado</h5>
        </li>

        <li class="breadcrumb-item bcrumb-1">
            <a routerLink="/" class="d-flex align-items-center" aria-label="Inicio">
                <i class="fas fa-home font-20" aria-hidden="true"></i>
            </a>
        </li>

        <li class="breadcrumb-item bcrumb-2">
            <a routerLink="/numerados" class="d-flex align-items-center">
                Numerados Existentes
            </a>
        </li>
    </ul>
    <div class="section-body">
        @if (error) {
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        }
        <div class="row">
            <div class="col-sm-12">
                <div class="form-group row">
                    <div class="col-sm-4">
                        <div class="d-flex">
                            <label for="buscar" class="col-form-label msr-3">Buscar:</label>
                            <input id="buscar" name="buscar" type="search" class="form-control" autocomplete="off" (input)="updateFilter($event)">
                        </div>
                    </div>
                    <div class="col-sm-auto ms-auto">
                        <button type="button" class="btn btn-primary" (click)="agregarNumerado()">
                            Agregar Numerado
                        </button>
                    </div>
                </div>
                <ngx-datatable #table class="material" [rows]="rows" [loadingIndicator]="loadingIndicator"
                    columnMode="force" [headerHeight]="50" [footerHeight]="50" rowHeight="auto" [limit]="10"
                    [scrollbarH]="scrollBarHorizontal" [reorderable]="reorderable">
                    <ngx-datatable-column [width]="200" name="Numero" headerClass="align-center-header" prop="numero">
                        <ng-template let-row="row" let-value="value" let-rowIndex="rowIndex"
                            ngx-datatable-cell-template>
                            <div>{{row.numero}}</div>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column [width]="200" name="Producto" headerClass="align-center-header"
                        prop="nombreProducto">
                        <ng-template let-row="row" let-value="value" let-rowIndex="rowIndex"
                            ngx-datatable-cell-template>
                            <div>{{row.nombreProducto}}</div>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Peso Disponible [Kg]" headerClass="align-center-header"
                        cellClass="align-center-cell" prop="peso">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            {{row.peso}}
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="" [sortable]="false" headerClass="align-center-header"
                        cellClass="align-center-cell">
                        <ng-template let-value="value" let-row="row" let-rowIndex="rowIndex"
                            ngx-datatable-cell-template>
                            <button type="button" class="msr-2 h-auto tblDelBtn" (click)="eliminarNumerado(row)" [attr.aria-label]="'Eliminar numerado ' + row.numero" [title]="'Eliminar numerado ' + row.numero">
                                <i class="fas fa-minus" aria-hidden="true"></i>
                            </button>
                        </ng-template>
                    </ngx-datatable-column>
                </ngx-datatable>
            </div>
        </div>
    </div>
</section>
