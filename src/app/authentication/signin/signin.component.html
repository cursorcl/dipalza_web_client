<main class="d-flex align-items-center min-vh-100 py-3 py-md-0">
  <div class="container">
    <div class="card login-card mb-0">
      <div class="row no-gutters">
        <div class="col-lg-5 d-none d-lg-block">
          <img src="assets/images/login.jpg" alt="login" class="login-card-img">
          </div>
          <div class="col-12 col-lg-7">
            <div class="login-body">
              <div class="text-center">
                <div class="brand-wrapper">
                  <img src="assets/images/logo_dipalza.png" alt="logo" class="logo"><span class="logo-name">Dipalza</span>
                </div>
              </div>
              <form class="validate-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="row">
                  @if (accounts.length > 0) {
                    <div class="col-lg-12">
                      <div class="form-group">
                        <label for="accountSelect">Cuentas guardadas</label>
                        <select id="accountSelect" class="form-select" (change)="onAccountSelected($any($event.target).value)">
                          <option value="" selected disabled>Seleccione una cuenta guardada</option>
                          @for (account of accounts; track account.username) {
                            <option [value]="account.username">{{ account.username }}</option>
                          }
                        </select>
                      </div>
                    </div>
                  }
                  <div class="col-lg-12">
                    <div class="form-group position-relative">
                      <label>Cuenta <span class="text-danger">*</span></label>
                      <i-feather name="user" class="login-icons"></i-feather>
                      <input type="email" class="form-control psl-5" formControlName="username" placeholder="Email">
                      </div>
                    </div>
                    <div class="col-lg-12">
                      <div class="form-group position-relative">
                        <label>Clave <span class="text-danger">*</span></label>
                        <i-feather name="key" class="login-icons"></i-feather>
                        <input type="password" class="form-control psl-5" formControlName="password"
                          placeholder="Password">
                        </div>
                      </div>
                      <div class="col-lg-12">
                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                          <div class="form-group">
                            <div class="form-check">
                              <input class="form-check-input" type="checkbox" id="customCheck1" formControlName="remember">
                                <label class="form-check-label" for="customCheck1">
                                  Recordame
                                </label>
                              </div>
                            </div>
                            <p class="forgot-pass mb-0"><a routerLink="/authentication/forgot"
                            class="text-dark fw-bold text-nowrap">Olvidó su clave ?</a></p>
                          </div>
                        </div>
                        @if (error) {
                          <div class="alert alert-danger mb-3 msl-3">{{error}}</div>
                        }
                        <div class="col-lg-12 mb-0">
                          <button class="btn btn-primary auth-form-btn">Ingresar</button>
                        </div>
                        <div class="col-lg-12 mt-4 text-center">
                          <h6>O ingresar con</h6>
                          <ul class="list-unstyled social-icon mb-0 mt-3">
                            <li class="list-inline-item"><a href="javascript:void(0)" class="rounded">
                              <i-feather name="facebook" class="fea-social sm-icon"></i-feather>
                            </a></li>
                            <li class="list-inline-item"><a href="javascript:void(0)" class="rounded">
                              <i-feather name="instagram" class="fea-social sm-icon"></i-feather>
                            </a></li>
                            <li class="list-inline-item"><a href="javascript:void(0)" class="rounded">
                              <i-feather name="twitter" class="fea-social sm-icon"></i-feather>
                            </a></li>
                          </ul>
                        </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
