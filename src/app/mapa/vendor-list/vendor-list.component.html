<div class="vendor-list__cabecera">
  <button type="button" class="vendor-list__header" [attr.aria-expanded]="!colapsado()" aria-controls="vendor-list-body"
    (click)="alternarColapso()">
    <span class="vendor-list__titulo">Vendedores</span>
    <span class="vendor-list__flecha" [class.vendor-list__flecha--colapsado]="colapsado()" aria-hidden="true">▾</span>
  </button>
  <button type="button" class="vendor-list__reporte-btn" title="Reporte de ubicaciones"
    aria-label="Reporte de ubicaciones" (click)="onReporte($event)">
    <span aria-hidden="true">📄</span>
  </button>
</div>
@if (!colapsado()) {
  <div class="vendor-list__body" id="vendor-list-body">
    @for (vendedor of vendedores; track vendedor.vendedorId) {
      <!-- Mouse: clic muestra/oculta el recorrido y doble clic centra el mapa (comportamiento original).
           Teclado y pantallas táctiles: el botón principal muestra/oculta el recorrido y el botón ⌖ centra. -->
      <div
        class="vendor-list__item"
        [class.vendor-list__item--selected]="isSelected(vendedor)"
        (dblclick)="onDoubleClick(vendedor.vendedorId)">
        <button
          type="button"
          class="vendor-list__seleccionar"
          [attr.aria-pressed]="isSelected(vendedor)"
          [attr.aria-label]="(isSelected(vendedor) ? 'Ocultar recorrido de ' : 'Mostrar recorrido de ') + vendedor.vendedorNombre"
          (click)="onSeleccionar(vendedor)">
          <span class="vendor-list__dot" [style.background-color]="vendedor.color" aria-hidden="true"></span>
          <span class="vendor-list__info">
            <span class="vendor-list__nombre" [title]="vendedor.vendedorNombre">{{ vendedor.vendedorNombre }}</span>
            <span class="vendor-list__tiempo">{{ vendedor.tiempoRelativo }}</span>
          </span>
        </button>
        <button
          type="button"
          class="vendor-list__accion-btn"
          title="Centrar mapa en el vendedor"
          [attr.aria-label]="'Centrar mapa en ' + vendedor.vendedorNombre"
          (click)="onCentrar($event, vendedor.vendedorId)">
          <span aria-hidden="true">⌖</span>
        </button>
        <button
          type="button"
          class="vendor-list__accion-btn vendor-list__historial-btn"
          title="Ver historial de recorridos"
          [attr.aria-label]="'Ver historial de recorridos de ' + vendedor.vendedorNombre"
          (click)="onHistorial($event, vendedor)">
          <span aria-hidden="true">🕘</span>
        </button>
        <span
          class="vendor-list__estado"
          [class.vendor-list__estado--online]="vendedor.online"
          role="img"
          [attr.aria-label]="vendedor.online ? 'En línea' : 'Sin conexión'"
          [title]="vendedor.online ? 'En línea' : 'Sin conexión'">
        </span>
      </div>
    }
  </div>
}
