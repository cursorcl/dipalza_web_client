<section class="main-content">
    <ul class="breadcrumb breadcrumb-style">
        <li class="breadcrumb-item">
            <h5 class="page-title m-b-0">Resultado de la Facturación</h5>
        </li>

        <li class="breadcrumb-item bcrumb-1">
            <a routerLink="/" class="d-flex align-items-center">
                <i class="fas fa-home font-20"></i>
            </a>
        </li>

        <li class="breadcrumb-item bcrumb-2">
            <a routerLink="/ventas" class="d-flex align-items-center">
                Ventas por Facturar
            </a>
        </li>
    </ul>
    <div class="section-body">
        <div class="row">
            <div class="col-sm-12">
                <ngx-datatable class="material" [rows]="rows" [loadingIndicator]="loadingIndicator"
                    [columnMode]="'force'" [headerHeight]="50" [footerHeight]="50" [rowHeight]="'auto'">

                    <ngx-datatable-column name="Código" prop="codigoVendedor" [width]="120"></ngx-datatable-column>
                    <ngx-datatable-column name="Vendedor" prop="nombreVendedor"></ngx-datatable-column>
                    <ngx-datatable-column name="Clientes" [width]="100" headerClass="align-center-header"
                        cellClass="align-center-cell">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            {{ row.clientes.length }}
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column [width]="60" [resizeable]="false" [sortable]="false" [draggable]="false"
                        [canAutoResize]="false" headerClass="align-center-header" cellClass="align-center-cell">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <a class="msr-2 h-auto tblViewBtn" (click)="gotoDetalle(row)" style="cursor: pointer;">
                                <i class="fas fa-eye"></i>
                            </a>
                        </ng-template>
                    </ngx-datatable-column>

                </ngx-datatable>
            </div>
        </div>
    </div>
</section>
