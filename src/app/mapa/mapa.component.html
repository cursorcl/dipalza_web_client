<section class="main-content">
<div class="mapa-layout">
  <div class="map-wrapper">
    <!-- Los paneles van antes que el mapa en el HTML para que Tab llegue primero a ellos; están
         posicionados de forma absoluta sobre el mapa, así que el orden no cambia lo que se ve. -->
    <app-vendor-list
      [vendedores]="vendedores()"
      [selectedId]="seleccionado()"
      (vendedorSeleccionado)="centrarEnVendedor($event)"
      (trayectoriaToggled)="toggleTrayectoria({ codigo: $event.vendedorId, tipo: $event.vendedorCodigo, nombre: $event.vendedorNombre })"
      (historialSolicitado)="abrirHistorial($event)"
      (reporteSolicitado)="abrirReporte()">
    </app-vendor-list>
    @if (historialAbierto()) {
      <app-historial-panel
        [vendedorNombre]="historialVendedor()?.vendedorNombre ?? ''"
        [fechas]="historialFechas()"
        [cargando]="historialCargando()"
        (fechaSeleccionada)="seleccionarFechaHistorial($event)"
        (cerrar)="cerrarHistorial()">
      </app-historial-panel>
    } @else if (nodosSeleccionados().length > 0) {
      <app-tramos-table [nodos]="nodosSeleccionados()" (centrarEnNodo)="centrarEnNodoDelMapa($event)"></app-tramos-table>
    }
    <div class="map-container" #map role="region" aria-label="Mapa de vendedores"></div>
    @if (toastMensaje(); as mensaje) {
      <div class="mapa-toast" role="status">{{ mensaje }}</div>
    }
  </div>
</div>
</section>
