<div class="modal-header">
  <h5 class="modal-title">Gestionar productos numerados</h5>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
  @if (error) {
    <div class="alert alert-danger" role="alert">{{ error }}</div>
  }

  <div class="form-group d-flex gap-2 align-items-end mb-3">
    <div class="flex-grow-1">
      <label for="buscador-producto-numerado">Agregar producto (busque por código o nombre)</label>
      <input id="buscador-producto-numerado" name="producto" type="text" class="form-control" autocomplete="off" [formControl]="buscadorControl"
        [ngbTypeahead]="buscarProducto" [resultFormatter]="formatearProducto"
        [inputFormatter]="formatearProducto" (selectItem)="seleccionarProducto($event)"
        placeholder="Ej: ART001 o Queso…" />
    </div>
    <button type="button" class="btn btn-primary" [disabled]="!productoSeleccionado || agregando"
      (click)="agregarProducto()">
      @if (agregando) {
        <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
      }
      Agregar Producto
    </button>
  </div>

  <ngx-datatable class="material" [rows]="rows" [loadingIndicator]="loading"
    columnMode="force" [headerHeight]="50" [footerHeight]="50" rowHeight="auto" [limit]="7"
    [scrollbarH]="scrollBarHorizontal" [reorderable]="reorderable">
    <ngx-datatable-column [width]="150" name="Código" headerClass="align-center-header" prop="codigoProducto">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <div>{{ row.codigoProducto }}</div>
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="Nombre" headerClass="align-center-header" prop="nombreProducto">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <div>{{ row.nombreProducto }}</div>
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column [width]="110" name="Piezas" headerClass="align-center-header"
      cellClass="align-right-cell" prop="piezas">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.piezas }}
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column [width]="140" name="Stock (peso)" headerClass="align-center-header"
      cellClass="align-center-cell" prop="stock">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.stock }}
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="" [width]="80" [sortable]="false" headerClass="align-center-header"
      cellClass="align-center-cell">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <!-- aria-disabled (y no disabled) para que el tooltip que explica por qué no se puede
             quitar siga visible; quitarProducto() ya ignora el clic en ese caso. -->
        <button type="button" class="msr-2 h-auto tblDelBtn"
          [attr.aria-disabled]="row.tieneRegistrosAsociados"
          [attr.aria-label]="row.tieneRegistrosAsociados ? 'No se puede quitar ' + row.nombreProducto + ': tiene numerados asociados' : 'Quitar ' + row.nombreProducto + ' de la lista de numerados'"
          [title]="row.tieneRegistrosAsociados ? 'No se puede quitar: tiene numerados asociados' : 'Quitar de la lista de numerados'"
          (click)="quitarProducto(row)">
          <i class="fas fa-trash" aria-hidden="true"></i>
        </button>
      </ng-template>
    </ngx-datatable-column>
  </ngx-datatable>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cerrar</button>
</div>
