<div class="modal-header">
  <h5 class="modal-title">Modificar usuario</h5>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="mod-username">Username</label>
      <input id="mod-username" type="text" class="form-control" [value]="usuario.username" disabled />
    </div>

    <div class="form-group">
      <label for="mod-nombre">Nombre (opcional)</label>
      <input id="mod-nombre" name="nombre" type="text" formControlName="nombre" class="form-control"
        placeholder="Ej: Luis Zamora…" autocomplete="off" maxlength="100"
        aria-describedby="mod-nombre-ayuda" />
      <small id="mod-nombre-ayuda" class="form-text text-muted">Se muestra en el saludo del sistema. Para vendedores se usa el nombre del vendedor.</small>
    </div>

    <div class="form-group">
      <label for="mod-email">Correo</label>
      <input id="mod-email" name="email" type="email" formControlName="email" class="form-control"
        placeholder="Ej: jperez@dipalza.cl…" autocomplete="off" spellcheck="false" />
    </div>

    <div class="form-group">
      <label for="mod-vendedor">Vendedor asociado (opcional, busque por código o nombre)</label>
      <div class="d-flex gap-2">
        <input id="mod-vendedor" name="vendedor" type="text" class="form-control" autocomplete="off" [formControl]="buscadorVendedorControl"
          [ngbTypeahead]="buscarVendedor" [resultFormatter]="formatearVendedor"
          [inputFormatter]="formatearVendedor" (selectItem)="seleccionarVendedor($event)"
          placeholder="Ej: 001 o Juan Pérez…" />
        <button type="button" class="btn btn-secondary text-nowrap" (click)="quitarVendedor()">Quitar Vendedor</button>
      </div>
    </div>

    <div class="form-check">
      <input type="checkbox" formControlName="enabled" class="form-check-input" id="enabledCheck" />
      <label class="form-check-label" for="enabledCheck">Habilitado</label>
    </div>

    <div class="form-check">
      <input type="checkbox" formControlName="locked" class="form-check-input" id="lockedCheck" />
      <label class="form-check-label" for="lockedCheck">Bloqueado</label>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cancelar</button>
  <button type="button" class="btn btn-primary" [disabled]="loading" (click)="submit()">
    @if (loading) {
      <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
      Guardando…
    } @else {
      Guardar Cambios
    }
  </button>
</div>
