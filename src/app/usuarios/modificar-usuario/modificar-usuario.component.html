<div class="modal-header">
  <h5 class="modal-title">Modificar usuario</h5>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="mod-username">Username</label>
      <input id="mod-username" type="text" class="form-control" [value]="usuario.username" disabled />
    </div>

    <fieldset class="form-group">
      <legend class="col-form-label pt-0">¿Es vendedor?</legend>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" id="mod-es-vendedor-si" name="mod-esVendedor"
          [formControl]="esVendedorControl" [value]="true" />
        <label class="form-check-label" for="mod-es-vendedor-si">Sí</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" id="mod-es-vendedor-no" name="mod-esVendedor"
          [formControl]="esVendedorControl" [value]="false" />
        <label class="form-check-label" for="mod-es-vendedor-no">No</label>
      </div>
    </fieldset>

    @if (esVendedorControl.value) {
      <!-- Vendedor: el nombre del usuario se toma del vendedor elegido. -->
      <div class="form-group">
        <label for="mod-vendedor">Vendedor (busque por código o nombre)</label>
        <input id="mod-vendedor" name="vendedor" type="text" class="form-control" autocomplete="off"
          [formControl]="buscadorVendedorControl"
          [ngbTypeahead]="buscarVendedor" [resultFormatter]="formatearVendedor"
          [inputFormatter]="formatearVendedor" (selectItem)="seleccionarVendedor($event)"
          placeholder="Ej: 001 o Juan Pérez…"
          [class.is-invalid]="intentoGuardar && faltaVendedor"
          aria-describedby="mod-vendedor-error" aria-required="true" />
        @if (intentoGuardar && faltaVendedor) {
          <div id="mod-vendedor-error" class="invalid-feedback">Seleccione un vendedor de la lista.</div>
        }
      </div>
    } @else {
      <div class="form-group">
        <label for="mod-nombre">Nombre</label>
        <input id="mod-nombre" name="nombre" type="text" formControlName="nombre" class="form-control"
          placeholder="Ej: Luis Zamora…" autocomplete="off" maxlength="100"
          [class.is-invalid]="form.get('nombre')?.touched && form.get('nombre')?.invalid"
          aria-describedby="mod-nombre-error" aria-required="true" />
        @if (form.get('nombre')?.touched && form.get('nombre')?.invalid) {
          <div id="mod-nombre-error" class="invalid-feedback">Ingrese el nombre del usuario.</div>
        }
      </div>
    }

    <div class="form-group">
      <label for="mod-email">Correo</label>
      <input id="mod-email" name="email" type="email" formControlName="email" class="form-control"
        placeholder="Ej: jperez@dipalza.cl…" autocomplete="off" spellcheck="false" />
    </div>

    <div class="form-check">
      <input type="checkbox" formControlName="enabled" class="form-check-input" id="enabledCheck" />
      <label class="form-check-label" for="enabledCheck">Habilitado</label>
    </div>

    <div class="form-check">
      <input type="checkbox" formControlName="locked" class="form-check-input" id="lockedCheck" />
      <label class="form-check-label" for="lockedCheck">Bloqueado</label>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cancelar</button>
  <button type="button" class="btn btn-primary" [disabled]="loading" (click)="submit()">
    @if (loading) {
      <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
      Guardando…
    } @else {
      Guardar Cambios
    }
  </button>
</div>
