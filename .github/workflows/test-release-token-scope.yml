name: Test RELEASE_TOKEN scope (temporal)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Verificar acceso de lectura al repo dipalza_server
        run: gh api repos/cursorcl/dipalza_server --jq '.full_name, .permissions'

      - name: Verificar acceso de lectura a Actions de dipalza_server
        run: gh api repos/cursorcl/dipalza_server/actions/workflows --jq '.workflows[].name'

      - name: Verificar permiso de escritura en Actions (dry-run de un dispatch inexistente)
        run: |
          # No hay todavía un workflow_dispatch objetivo en dipalza_server (eso es el paso 2).
          # Este intento fallará con 404 si el token puede alcanzar la API pero el
          # workflow no existe, o con 403/401 si el token NO tiene el scope necesario
          # (actions:write) sobre dipalza_server. Ambos casos son informativos.
          gh api repos/cursorcl/dipalza_server/actions/workflows/sync-frontend.yml/dispatches \
            -X POST -f ref=main || echo "Resultado del intento de dispatch (ver código/mensaje arriba) ^"
