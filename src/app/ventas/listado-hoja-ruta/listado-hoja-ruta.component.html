<section class="main-content">
    <ul class="breadcrumb breadcrumb-style">
        <li class="breadcrumb-item">
            <h5 class="page-title m-b-0">Hoja de Ruta</h5>
        </li>

        <li class="breadcrumb-item bcrumb-1">
            <a routerLink="/" class="d-flex align-items-center">
                <i class="fas fa-home font-20"></i>
            </a>
        </li>
    </ul>
    <div class="section-body">
        <div class="row">
            <div class="col-sm-12">
                <div class="card">
                    <div class="card-body">
                        <p class="text-muted">
                            Productos numerados vendidos (ventas ya facturadas) en el día elegido,
                            agrupados por ruta de reparto, con los números de pieza de cada producto.
                        </p>

                        <div class="form-group row align-items-center mb-3">
                            <div class="col-sm-5">
                                <div class="d-flex align-items-center">
                                    <button class="btn btn-sm btn-outline-secondary" (click)="diaAnterior()" [disabled]="!fecha">
                                        <i class="fas fa-chevron-left"></i>
                                    </button>
                                    <input type="date" class="form-control mx-2" style="max-width: 180px;"
                                        [(ngModel)]="fecha" (change)="onFechaChange()">
                                    <button class="btn btn-sm btn-outline-secondary" (click)="diaSiguiente()" [disabled]="!fecha">
                                        <i class="fas fa-chevron-right"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-sm-7 text-sm-end">
                                <button class="btn btn-primary" [disabled]="!fecha || descargando || rows.length === 0" (click)="descargar('xlsx')">
                                    <span *ngIf="descargando === 'xlsx'" class="spinner-border spinner-border-sm me-1"></span>
                                    Descargar Excel
                                </button>
                                <button class="btn btn-outline-primary ms-2" [disabled]="!fecha || descargando || rows.length === 0" (click)="descargar('pdf')">
                                    <span *ngIf="descargando === 'pdf'" class="spinner-border spinner-border-sm me-1"></span>
                                    Descargar PDF
                                </button>
                            </div>
                        </div>

                        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

                        <div class="alert alert-info" *ngIf="!loadingIndicator && !error && rows.length === 0">
                            No hay productos numerados en ventas facturadas para este día.
                        </div>

                        <ngx-datatable *ngIf="rows.length > 0" class="material" [rows]="rows" [columnMode]="'force'"
                            [headerHeight]="50" [footerHeight]="50" [rowHeight]="'auto'" [limit]="15"
                            [loadingIndicator]="loadingIndicator">

                            <ngx-datatable-column name="Ruta" prop="nombreRuta" [width]="150"></ngx-datatable-column>
                            <ngx-datatable-column name="Código" prop="codigoProducto" [width]="90"></ngx-datatable-column>
                            <ngx-datatable-column name="Producto" prop="nombreProducto"></ngx-datatable-column>
                            <ngx-datatable-column name="Números de Pieza" prop="numerosPiezas" [width]="200"></ngx-datatable-column>
                            <ngx-datatable-column name="Cantidad" prop="cantidad" [width]="110"
                                headerClass="align-center-header" cellClass="align-center-cell">
                                <ng-template let-value="value" ngx-datatable-cell-template>
                                    {{ value | number:'1.2-2' }}
                                </ng-template>
                            </ngx-datatable-column>
                            <ngx-datatable-column name="Total" prop="totalLinea" [width]="130"
                                headerClass="align-center-header" cellClass="align-center-cell">
                                <ng-template let-value="value" ngx-datatable-cell-template>
                                    {{ value | number:'1.0-0' }}
                                </ng-template>
                            </ngx-datatable-column>

                        </ngx-datatable>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
