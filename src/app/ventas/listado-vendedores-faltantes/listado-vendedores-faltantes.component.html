<section class="main-content">
    <ul class="breadcrumb breadcrumb-style">
        <li class="breadcrumb-item">
            <h5 class="page-title m-b-0">Faltantes</h5>
        </li>

        <li class="breadcrumb-item bcrumb-1">
            <a routerLink="/" class="d-flex align-items-center">
                <i class="fas fa-home font-20"></i>
            </a>
        </li>
    </ul>
    <div class="section-body">
        <div class="row">
            <div class="col-sm-12">
                <div class="form-group row align-items-center">
                    <div class="col-sm-5">
                        <div class="d-flex align-items-center">
                            <button class="btn btn-sm btn-outline-secondary" (click)="diaAnterior()" [disabled]="!fecha">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <input type="date" class="form-control mx-2" style="max-width: 180px;"
                                [(ngModel)]="fecha" (change)="onFechaChange()">
                            <button class="btn btn-sm btn-outline-secondary" (click)="diaSiguiente()" [disabled]="!fecha">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-sm-7 text-sm-end">
                        <div class="btn-group" role="group">
                            <button class="btn btn-sm" [class.btn-primary]="vista === 'factura'"
                                [class.btn-outline-primary]="vista !== 'factura'" (click)="vista = 'factura'">
                                Por Factura
                            </button>
                            <button class="btn btn-sm" [class.btn-primary]="vista === 'producto'"
                                [class.btn-outline-primary]="vista !== 'producto'" (click)="vista = 'producto'">
                                Por Producto
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Vista: una fila por factura (o por venta, si no llegó a facturar nada) -->
                <ngx-datatable *ngIf="vista === 'factura'" class="material" [rows]="rows"
                    [loadingIndicator]="loadingIndicator" [columnMode]="'force'" [headerHeight]="50"
                    [footerHeight]="50" [rowHeight]="'auto'" [limit]="10">

                    <ngx-datatable-column name="Factura" prop="nroFactura" [width]="150">
                        <ng-template let-value="value" let-row="row" ngx-datatable-cell-template>
                            <span *ngIf="value" [title]="row.facturaEstimada ? 'Estimada: la línea facturada más cercana de esta venta' : ''">
                                {{ value }}<span *ngIf="row.facturaEstimada">&nbsp;(est.)</span>
                            </span>
                            <span *ngIf="!value">Venta #{{ row.ventaId }} (sin factura)</span>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Cliente" prop="nombreCliente"></ngx-datatable-column>
                    <ngx-datatable-column name="Vendedor" prop="nombreVendedor"></ngx-datatable-column>
                    <ngx-datatable-column name="Productos Faltantes" prop="cantidadItems" [width]="180"
                        headerClass="align-center-header" cellClass="align-center-cell">
                        <ng-template let-value="value" ngx-datatable-cell-template>
                            <span class="badge bg-danger">{{ value }}</span>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="" [width]="60" [sortable]="false">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <a class="tblViewBtn" (click)="gotoDetalle(row)" style="cursor: pointer;">
                                <i class="fas fa-eye"></i>
                            </a>
                        </ng-template>
                    </ngx-datatable-column>

                </ngx-datatable>

                <!-- Vista: total de productos faltantes (agregado, sin vendedor/cliente) -->
                <ngx-datatable *ngIf="vista === 'producto'" class="material" [rows]="productosAgregados"
                    [loadingIndicator]="loadingIndicator" [columnMode]="'force'" [headerHeight]="50"
                    [footerHeight]="50" [rowHeight]="'auto'" [limit]="10">

                    <ngx-datatable-column name="Código" prop="codigoProducto" [width]="100"></ngx-datatable-column>
                    <ngx-datatable-column name="Producto" prop="nombreProducto"></ngx-datatable-column>
                    <ngx-datatable-column name="Cantidad Faltante" prop="cantidadFaltanteTotal" [width]="180"
                        headerClass="align-center-header" cellClass="align-center-cell"></ngx-datatable-column>
                    <ngx-datatable-column name="Piezas Faltante" prop="piezasFaltanteTotal" [width]="180"
                        headerClass="align-center-header" cellClass="align-center-cell"></ngx-datatable-column>

                </ngx-datatable>
            </div>
        </div>
    </div>
</section>
