<section class="main-content">
    <ul class="breadcrumb breadcrumb-style">
        <li class="breadcrumb-item">
            <h5 class="page-title m-b-0">
                Faltantes de {{ factura?.nombreCliente }}
                <small class="text-muted">({{ factura?.nroFactura ?? ('Venta #' + factura?.ventaId + ' sin factura') }})</small>
            </h5>
        </li>

        <li class="breadcrumb-item bcrumb-1">
            <a routerLink="/" class="d-flex align-items-center">
                <i class="fas fa-home font-20"></i>
            </a>
        </li>

        <li class="breadcrumb-item bcrumb-2">
            <a routerLink="/ventas/faltantes" class="d-flex align-items-center">
                Faltantes
            </a>
        </li>
    </ul>
    <div class="section-body">
        <div class="row">
            <div class="col-sm-12">
                <ngx-datatable class="material" [rows]="rows" [columnMode]="'force'" [headerHeight]="50"
                    [footerHeight]="50" [rowHeight]="'auto'" [limit]="10">

                    <ngx-datatable-column name="Código" prop="codigoProducto" [width]="100"></ngx-datatable-column>
                    <ngx-datatable-column name="Producto" prop="nombreProducto"></ngx-datatable-column>
                    <ngx-datatable-column name="Cantidad Solicitada" prop="cantidadSolicitada" [width]="150"
                        headerClass="align-center-header" cellClass="align-center-cell"></ngx-datatable-column>
                    <ngx-datatable-column name="Cantidad Faltante" prop="cantidadFaltante" [width]="150"
                        headerClass="align-center-header" cellClass="align-center-cell">
                        <ng-template let-value="value" ngx-datatable-cell-template>
                            {{ value ?? '—' }}
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Piezas Solicitadas" prop="piezasSolicitadas" [width]="150"
                        headerClass="align-center-header" cellClass="align-center-cell">
                        <ng-template let-value="value" ngx-datatable-cell-template>
                            {{ value ?? '—' }}
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Piezas Faltantes" prop="piezasFaltantes" [width]="150"
                        headerClass="align-center-header" cellClass="align-center-cell">
                        <ng-template let-value="value" ngx-datatable-cell-template>
                            {{ value ?? '—' }}
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Motivo" prop="motivo">
                        <ng-template let-value="value" ngx-datatable-cell-template>
                            <span class="text-danger">{{ value ?? '—' }}</span>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Factura" prop="nroFactura" [width]="140">
                        <ng-template let-value="value" let-row="row" ngx-datatable-cell-template>
                            <span *ngIf="value" [title]="row.facturaEstimada ? 'Estimada: la línea facturada más cercana de esta venta, esta línea no se facturó' : ''">
                                {{ value }}<span *ngIf="row.facturaEstimada">&nbsp;(est.)</span>
                            </span>
                            <span *ngIf="!value">—</span>
                        </ng-template>
                    </ngx-datatable-column>

                </ngx-datatable>
            </div>
        </div>
    </div>
</section>
