<section class="main-content">
    <ul class="breadcrumb breadcrumb-style">
        <li class="breadcrumb-item">
            <h5 class="page-title m-b-0">Gestionar Usuarios</h5>
        </li>
        <li class="breadcrumb-item bcrumb-1">
            <a routerLink="/" class="d-flex align-items-center" aria-label="Inicio">
                <i class="fas fa-home font-20" aria-hidden="true"></i>
            </a>
        </li>
    </ul>
    <div class="section-body">
        <div class="row">
            <div class="col-sm-12">
                <div class="form-group row">
                    <div class="col-sm-4">
                        <div class="d-flex">
                            <label for="buscar" class="col-form-label msr-3">Buscar:</label>
                            <input id="buscar" name="buscar" type="search" class="form-control" autocomplete="off" (input)="updateFilter($event)">
                        </div>
                    </div>
                    <div class="col-sm-auto ms-auto">
                        <button type="button" class="btn btn-primary" (click)="agregar()">Agregar Usuario</button>
                    </div>
                </div>
                <ngx-datatable class="material" [rows]="rows" [loadingIndicator]="loadingIndicator"
                    columnMode="force" [headerHeight]="50" [footerHeight]="50" rowHeight="auto" [limit]="10"
                    [scrollbarH]="scrollBarHorizontal" [reorderable]="reorderable">
                    <ngx-datatable-column name="Username" headerClass="align-center-header" prop="username">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <div>{{ row.username }}</div>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Nombre" headerClass="align-center-header" prop="nombre">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <div>{{ row.nombre || '-' }}</div>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Correo" headerClass="align-center-header" prop="email">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <div>{{ row.email || '-' }}</div>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Vendedor" headerClass="align-center-header" prop="nombreVendedor">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <div>{{ row.nombreVendedor || '-' }}</div>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Habilitado" headerClass="align-center-header" cellClass="align-center-cell">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <button type="button" class="badge border-0" [class.bg-success]="row.enabled" [class.bg-secondary]="!row.enabled"
                                (click)="toggleHabilitado(row)"
                                [attr.aria-label]="(row.enabled ? 'Habilitado. Deshabilitar a ' : 'Deshabilitado. Habilitar a ') + row.username"
                                [title]="row.enabled ? 'Clic para deshabilitar' : 'Clic para habilitar'">
                                {{ row.enabled ? 'Habilitado' : 'Deshabilitado' }}
                            </button>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="Bloqueado" headerClass="align-center-header" cellClass="align-center-cell">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <button type="button" class="badge border-0" [class.bg-danger]="row.locked" [class.bg-secondary]="!row.locked"
                                (click)="toggleBloqueado(row)"
                                [attr.aria-label]="(row.locked ? 'Bloqueado. Desbloquear a ' : 'Desbloqueado. Bloquear a ') + row.username"
                                [title]="row.locked ? 'Clic para desbloquear' : 'Clic para bloquear'">
                                {{ row.locked ? 'Bloqueado' : 'Desbloqueado' }}
                            </button>
                        </ng-template>
                    </ngx-datatable-column>
                    <ngx-datatable-column name="" [width]="80" [sortable]="false" headerClass="align-center-header" cellClass="align-center-cell">
                        <ng-template let-row="row" ngx-datatable-cell-template>
                            <button type="button" class="msr-2 h-auto tblViewBtn" (click)="ver(row)" [attr.aria-label]="'Ver usuario ' + row.username" [title]="'Ver usuario ' + row.username">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                            <button type="button" class="msr-2 h-auto tblEditBtn" (click)="modificar(row)" [attr.aria-label]="'Modificar usuario ' + row.username" [title]="'Modificar usuario ' + row.username">
                                <i class="fas fa-pencil-alt" aria-hidden="true"></i>
                            </button>
                        </ng-template>
                    </ngx-datatable-column>
                </ngx-datatable>
            </div>
        </div>
    </div>
</section>
